<body style="background-color: #f1f5f9; font-family: Arial, sans-serif; text-align: center; padding: 50px; margin: 0; min-height: 100vh; box-sizing: border-box;">

        <section>

        </section>

        <div style="display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;">

            <button style="padding: 13px 28px; font-size: 16px; font-weight: bold; color: #b91c1c; background-color: #fee2e2; border: none; border-radius: 8px; cursor: pointer;">
                Cancel
            </button>

           <a href="pinscreen.html" style="text-decoration: none;">
                <button style="padding: 13px 28px; font-size: 16px; font-weight: bold; color: white; background-color: #15803d; border: none; border-radius: 8px; cursor: pointer;">

            </a>

        </div>

    </div>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM UI</title>
</head>

<body style="background-color: #f1f5f9; font-family: Arial, sans-serif; text-align: center; padding: 50px; margin: 0; min-height: 100vh; box-sizing: border-box;">

    <h1 style="font-size: 42px; color: #0f172a; margin-bottom: 30px; letter-spacing: 2px;">
        D&Q BANK
    </h1>

    <div style="background-color: white; max-width: 550px; margin: 0 auto; padding: 40px 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); border: 1px solid #e2e8f0;">

        <h3 style="font-size: 26px; color: #0f172a; margin-bottom: 20px;">
            Welcome to our ATM
        </h3>

        <p style="font-size: 18px; color: #64748b; margin-bottom: 30px; line-height: 1.6;">
            Please select your card to continue
        </p>

        <section>
            <div style="display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-bottom: 30px;">

                <button style="padding: 14px 22px; font-size: 16px; font-weight: bold; color: #1e293b; background-color: #f8fafc; border: 2px solid #cbd5e1; border-radius: 8px; cursor: pointer;">
                    Master
                </button>

                <button style="padding: 14px 22px; font-size: 16px; font-weight: bold; color: #1e293b; background-color: #f8fafc; border: 2px solid #cbd5e1; border-radius: 8px; cursor: pointer;">
                    Visa
                </button>

                <button style="padding: 14px 22px; font-size: 16px; font-weight: bold; color: #1e293b; background-color: #f8fafc; border: 2px solid #cbd5e1; border-radius: 8px; cursor: pointer;">
                    Verve
                </button>

            </div>
        </section>

        <div style="display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;">

            <button style="padding: 13px 28px; font-size: 16px; font-weight: bold; color: #b91c1c; background-color: #fee2e2; border: none; border-radius: 8px; cursor: pointer;">
                Cancel
            </button>

           <a href="pinscreen.html" style="text-decoration: none;">
                <button style="padding: 13px 28px; font-size: 16px; font-weight: bold; color: white; background-color: #15803d; border: none; border-radius: 8px; cursor: pointer;">
                    Proceed
                </button>
            </a>

        </div>

    </div>


    

</body>
</html>

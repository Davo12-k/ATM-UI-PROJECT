<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balance page</title>
</head>
<body style="margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background: whitesmoke; font-family:'Segoe UI',Tahoma,Verdana,sans-serif; color:#14233a;">
    <div style="width:100%; padding: 24px; max-width:440px; margin:24px; background:white; border-radius:16px; overflow:hidden; box-shadow:0 12px 40px rgba(11,42,74,0.18);">
        <p style="margin:0 0 6px; font-size:12px; font-weight:700; letter-spacing:2px; color:#8a99ad;">ACCOUNT ENQUIRY</p>
        <h2 style="margin:0 0 6px; font-size:30px; font-weight:700; letter-spacing:-0.3px; color:#0b2a4a;">Check Balance</h2>
        <div style="padding:24px 16px; background:#f6f8fb; border:2px solid #0b2a4a; border-radius:12px;">
            <p>Available balance</p>
            <h1>₦25,000.00</h1>
        </div>



        <button style="display:block; box-sizing:border-box; height:52px; margin-bottom:12px;width: 100%; font-size:17px; font-weight:700; color:#ffffff; background:#0b2a4a; border-radius:10px;">Print Receipt</button>
        <button style="display:block; box-sizing:border-box; height:52px;  margin-bottom:12px; font-size:17px; font-weight:600; color:#0b2a4a; background:#ffffff; width: 100%; border:2px solid #0b2a4a; border-radius:10px;">Back to Menu</button>
        <button style="display:block; box-sizing:border-box; height:52px; font-size:17px; font-weight:600; color:#b3261e; background:#ffffff; border:2px solid #b3261e; border-radius:10px; width: 100%;">Exit</button>

    </div>
    
</body>
</html>

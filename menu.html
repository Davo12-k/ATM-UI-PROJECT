<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM Menu</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body style="margin: 0; font-family: Arial, sans-serif; background-color: #F8FAF8; color: #1F2937;">

    <h1 style="text-align: center; margin-top: 40px; margin-bottom: 10px; font-size: 32px; font-weight: 800; letter-spacing: 3px; color: #14532D;">
        ATM MENU
    </h1>

    <p style="text-align: center; margin-top: 0; color: #6B7280; font-size: 15px;">
        Select a service to continue
    </p>

    <div style="display: flex; justify-content: center; align-items: center; gap: 40px; min-height: 65vh; padding: 20px; box-sizing: border-box;">

        <div style="display: flex; flex-direction: column; gap: 22px;">

            <a href="check-balance.html" style="text-decoration: none;">
                <button style="width: 250px; padding: 18px 15px; font-size: 17px; font-weight: 600; border: none; border-radius: 10px; cursor: pointer; background-color: #14532D; color: white; box-shadow: 0 4px 8px rgba(20,83,45,0.15);">
                    Check Balance
                </button>
            </a>

            <a href="withdraw.html" style="text-decoration: none;">
                <button style="width: 250px; padding: 18px 15px; font-size: 17px; font-weight: 600; border: none; border-radius: 10px; cursor: pointer; background-color: #14532D; color: white; box-shadow: 0 4px 8px rgba(20,83,45,0.15);">
                    Withdraw Cash
                </button>
            </a>

            <a href="deposit.html" style="text-decoration: none;">
                <button style="width: 250px; padding: 18px 15px; font-size: 17px; font-weight: 600; border: none; border-radius: 10px; cursor: pointer; background-color: #14532D; color: white; box-shadow: 0 4px 8px rgba(20,83,45,0.15);">
                    Deposit Money
                </button>
            </a>

        </div>

        <div style="display: flex; flex-direction: column; gap: 22px;">

            <a href="transfer.html" style="text-decoration: none;">
                <button style="width: 250px; padding: 18px 15px; font-size: 17px; font-weight: 600; border: none; border-radius: 10px; cursor: pointer; background-color: #14532D; color: white; box-shadow: 0 4px 8px rgba(20,83,45,0.15);">
                    Transfer Money
                </button>
            </a>

            <a href="change_pin.html" style="text-decoration: none;">
                <button style="width: 250px; padding: 18px 15px; font-size: 17px; font-weight: 600; border: none; border-radius: 10px; cursor: pointer; background-color: #14532D; color: white; box-shadow: 0 4px 8px rgba(20,83,45,0.15);">
                    Change PIN
                </button>
            </a>

            <a href="transaction_history.html" style="text-decoration: none;">
                <button style="width: 250px; padding: 18px 15px; font-size: 17px; font-weight: 600; border: none; border-radius: 10px; cursor: pointer; background-color: #14532D; color: white; box-shadow: 0 4px 8px rgba(20,83,45,0.15);">
                    Transaction History
                </button>
            </a>

        </div>

    </div>

    <a href="index.html" style="text-decoration: none;">
        <button style="position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); width: 200px; padding: 14px; font-size: 17px; font-weight: 700; border: none; border-radius: 10px; color: white; cursor: pointer; background-color: #B3261E; box-shadow: 0 4px 8px rgba(179,38,30,0.2);">
            Exit ATM
        </button>
    </a>


        
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM Menu</title>
</head>

<body style="margin: 0; font-family: Arial, sans-serif;">

    <h1 style="text-align: center; margin-top: 30px;">MENU</h1>

    <div style="display: flex; justify-content: space-between; align-items: center; height: 65vh; padding: 0 50px;">

        
        <div style="display: flex; flex-direction: column; gap: 30px;">
            <button onclick="window.location.href='check_balance.html'" style="width: 200px; padding: 12px; font-size: 18px; border: 2px solid grey; border-radius: 8px; cursor: pointer;">
                Check Balance
            </button>

            <button onclick="window.location.href='withdraw.html'" style="width: 200px; padding: 12px; font-size: 18px; border: 2px solid grey; border-radius: 8px; cursor: pointer;">
                Withdraw Cash
            </button>

            <button onclick="window.location.href='deposit.html'" style="width: 200px; padding: 12px; font-size: 18px; border: 2px solid grey; border-radius: 8px; cursor: pointer;">
                Deposit Money
            </button>
        </div>

        
        <div style="display: flex; flex-direction: column; gap: 30px;">
            <button onclick="window.location.href='transfer.html'"
                style="width: 200px; padding: 12px; font-size: 18px; border: 2px solid grey; border-radius: 8px; cursor: pointer;">
                Transfer Money
            </button>

            <button onclick="window.location.href='change_pin.html'" style="width: 200px; padding: 12px; font-size: 18px; border: 2px solid grey; border-radius: 8px; cursor: pointer;">
                Change PIN
            </button>

            <button onclick="window.location.href='transaction_history.html'" style="width: 200px; padding: 12px; font-size: 18px; border: 2px solid grey; border-radius: 8px; cursor: pointer;">
                View Transaction History
            </button>
        </div>

    </div>

    
    <button style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 180px; padding: 12px; font-size: 18px; border: none; border-radius: 8px; color:  white; cursor: pointer; background-color: red;">
        Exit
    </button>   

</body>
</html>

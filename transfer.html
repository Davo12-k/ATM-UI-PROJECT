<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer Page</title>
</head>

<body style="margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#f1f4f8; font-family:'Segoe UI',Tahoma,Verdana,sans-serif; color:#14233a;">

    <div style="width:100%; max-width:380px; margin:20px; padding:28px; background:white; border-radius:12px; box-shadow:0 8px 25px rgba(11,42,74,0.12); box-sizing:border-box;">

        <p style="margin:0 0 8px; font-size:12px; font-weight:700; letter-spacing:2px; color:#7b8798;">
            ACCOUNT SERVICES
        </p>

        <h2 style="margin:0 0 8px; font-size:28px; color:#0b2a4a;">
            Funds Transfer
        </h2>

        <p style="margin:0 0 25px; font-size:14px; color:#68768a;">
            Enter the recipient's account number and transfer amount.
        </p>

        <label for="accountNumber" style="display:block; margin-bottom:8px; font-size:14px; font-weight:600;">
            Recipient Account Number
        </label>

        <input
            id="accountNumber"
            type="text"
            inputmode="numeric"
            maxlength="10"
            placeholder="Enter account number"
            style="display:block; box-sizing:border-box; margin-bottom:12px; padding:13px; font-size:15px; width:100%; border:1px solid #ccd4df; border-radius:6px;"
        >

        <button
            id="checkAccount"
            type="button"
            style="width:100%; padding:12px; margin-bottom:10px; background:#0b2a4a; color:white; border:none; border-radius:6px; cursor:pointer;"
        >
            Verify Account
        </button>

        <p id="accountName" aria-live="polite" style="margin:0 0 20px; font-size:14px; font-weight:600;"></p>

        <label for="amount" style="display:block; margin-bottom:8px; font-size:14px; font-weight:600;">
            Transfer Amount
        </label>

        <input
            id="amount"
            type="text"
            inputmode="numeric"
            placeholder="₦ Enter amount"
            readonly
            style="display:block; box-sizing:border-box; margin-bottom:22px; padding:13px; font-size:15px; width:100%; border:1px solid #ccd4df; border-radius:6px;"
        >

        <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:10px;">

            <button type="button" class="key" data-number="1">1</button>
            <button type="button" class="key" data-number="2">2</button>
            <button type="button" class="key" data-number="3">3</button>
            <button type="button" class="key" data-number="4">4</button>
            <button type="button" class="key" data-number="5">5</button>
            <button type="button" class="key" data-number="6">6</button>
            <button type="button" class="key" data-number="7">7</button>
            <button type="button" class="key" data-number="8">8</button>
            <button type="button" class="key" data-number="9">9</button>
            <button type="button" class="key" data-number="0">0</button>

            <button id="deleteBtn" type="button" style="height:52px; font-size:13px; font-weight:600; background:#fff0ef; color:#b3261e; border:1px solid #e5b7b4; border-radius:6px; cursor:pointer;">
                Delete
            </button>

            <button id="enterBtn" type="button" style="height:52px; font-size:13px; font-weight:600; background:#14532d; color:white; border:none; border-radius:6px; cursor:pointer;">
                Enter
            </button>

        </div>

        <p id="message" aria-live="polite" style="margin:15px 0; text-align:center; font-size:14px;"></p>

        <button
            id="backBtn"
            type="button"
            style="width:100%; padding:12px; background:#e8edf3; color:#14233a; border:none; border-radius:6px; cursor:pointer;"
        >
            Back to Menu
        </button>

        <p style="margin:20px 0 0; text-align:center; font-size:12px; color:#7b8798;">
            Please verify the recipient's details before transferring.
        </p>

    </div>

    <style>
        .key {
            height: 52px;
            font-size: 18px;
            font-weight: 600;
            background: #f1f4f8;
            color: black;
            border: 1px solid #d6dde7;
            border-radius: 6px;
            cursor: pointer;
        }

        .key:hover {
            background: #dfe7f0;
        }
    </style>

    <script>
        
let users = JSON.parse(localStorage.getItem("users")) || [];
let currentUser = JSON.parse(localStorage.getItem("currentUser"));

let recipient = null;

const accountNumber = document.getElementById("accountNumber");
const checkAccount = document.getElementById("checkAccount");
const accountName = document.getElementById("accountName");
const amount = document.getElementById("amount");
const message = document.getElementById("message");
const deleteBtn = document.getElementById("deleteBtn");
const enterBtn = document.getElementById("enterBtn");
const backBtn = document.getElementById("backBtn");

// Check that a user is logged in
if (!currentUser) {
    message.textContent = "Please log in through the PIN screen first.";
    message.style.color = "#b3261e";
}

// Verify recipient account
checkAccount.addEventListener("click", function () {
    let enteredAccount = accountNumber.value.trim();

    recipient = null;
    amount.value = "";
    accountName.textContent = "";

    if (!/^\d{10}$/.test(enteredAccount)) {
        message.textContent = "Enter a valid 10-digit account number.";
        message.style.color = "#b3261e";
        return;
    }

    if (!currentUser) {
        message.textContent = "Please log in first.";
        message.style.color = "#b3261e";
        return;
    }

    if (enteredAccount === currentUser.accountNumber) {
        message.textContent = "You cannot transfer money to yourself.";
        message.style.color = "#b3261e";
        return;
    }

    recipient = users.find(function (user) {
        return user.accountNumber === enteredAccount;
    });

    if (recipient) {
        accountName.textContent = "Account name: " + recipient.name;
        accountName.style.color = "#14532d";

        message.textContent = "Account verified successfully.";
        message.style.color = "#14532d";
    } else {
        message.textContent = "Account not found.";
        message.style.color = "#b3261e";
    }
});

// Clear recipient verification if account number changes
accountNumber.addEventListener("input", function () {
    recipient = null;
    accountName.textContent = "";
    amount.value = "";
    message.textContent = "";
});

// Number keypad
document.querySelectorAll(".key").forEach(function (button) {
    button.addEventListener("click", function () {
        if (!recipient) {
            message.textContent = "Verify the recipient first.";
            message.style.color = "#b3261e";
            return;
        }

        amount.value += button.dataset.number;
        message.textContent = "";
    });
});

// Delete the last digit
deleteBtn.addEventListener("click", function () {
    amount.value = amount.value.slice(0, -1);
});

// Enter and transfer money
enterBtn.addEventListener("click", function () {
    if (!currentUser) {
        message.textContent = "Please log in first.";
        message.style.color = "#b3261e";
        return;
    }

    if (!recipient) {
        message.textContent = "Please verify the recipient first.";
        message.style.color = "#b3261e";
        return;
    }

    let transferAmount = Number(amount.value);

    if (!Number.isSafeInteger(transferAmount) || transferAmount <= 0) {
        message.textContent = "Enter a valid transfer amount.";
        message.style.color = "#b3261e";
        return;
    }

    // Find the latest sender and recipient records
    let senderIndex = users.findIndex(function (user) {
        return user.accountNumber === currentUser.accountNumber;
    });

    let recipientIndex = users.findIndex(function (user) {
        return user.accountNumber === recipient.accountNumber;
    });

    if (senderIndex === -1 || recipientIndex === -1) {
        message.textContent = "Account details could not be found.";
        message.style.color = "#b3261e";
        return;
    }

    let sender = users[senderIndex];
    let receiver = users[recipientIndex];

    if (sender.accountNumber === receiver.accountNumber) {
        message.textContent = "You cannot transfer money to yourself.";
        message.style.color = "#b3261e";
        return;
    }

    if (
        typeof sender.balance !== "number" ||
        !Number.isFinite(sender.balance) ||
        sender.balance < 0
    ) {
        message.textContent = "Your account balance is invalid.";
        message.style.color = "#b3261e";
        return;
    }

    if (transferAmount > sender.balance) {
        message.textContent = "Insufficient funds.";
        message.style.color = "#b3261e";
        return;
    }

    // Update both balances
    sender.balance -= transferAmount;
    receiver.balance += transferAmount;

    // Save updated users
    localStorage.setItem("users", JSON.stringify(users));

    // Update the logged-in user's information
    currentUser = sender;
    localStorage.setItem("currentUser", JSON.stringify(currentUser));

    // Save transaction history
    let transactions =
        JSON.parse(localStorage.getItem("transactions")) || [];

    transactions.push({
        type: "transfer",
        amount: transferAmount,
        senderAccount: sender.accountNumber,
        recipientAccount: receiver.accountNumber,
        recipientName: receiver.name,
        date: new Date().toISOString()
    });

    localStorage.setItem("transactions", JSON.stringify(transactions));

    message.textContent =
        "Transfer successful! New balance: ₦" +
        sender.balance.toLocaleString("en-NG");

    message.style.color = "#14532d";

    amount.value = "";
    accountNumber.value = "";
    accountName.textContent = "";
    recipient = null;
});

// Return to menu
backBtn.addEventListener("click", function () {
    window.location.href = "menu.html";
});

        
    </script>
    

</body>
</html>

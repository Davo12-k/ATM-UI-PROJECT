<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer Page</title>
</head>
<body>

    <input id="transfer-amount" type="text" placeholder="Choose a recipient account" style="display: block; margin: 20px auto; padding: 10px; font-size: 16px; width: 220px; text-align: center; border: 3px solid #ccc; border-radius: 4px;">

    <input type="text" placeholder="Enter Amount" style="display: block; margin: 20px auto; padding: 10px; font-size: 16px; width: 220px; text-align: center; border: 3px solid #ccc; border-radius: 4px;">

    <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap: 5px; width: 250px; margin: 30px auto 0; align-items: center; justify-content: center;">
        <button style="display: block; margin: 10px auto; padding: 10px; font-size: 16px; width: 60px; height: 60px; border: 3px solid #ccc; border-radius: 4px;">1</button>
    <button style="display: block; margin: 10px auto; padding: 10px; font-size: 16px; width: 60px; height: 60px; border: 3px solid #ccc; border-radius: 4px;">2</button>
    <button style="display: block; margin: 10px auto; padding: 10px; font-size: 16px; width: 60px; height: 60px; border: 3px solid #ccc; border-radius: 4px;">3</button>
    <button style="display: block; margin: 10px auto; padding: 10px; font-size: 16px; width: 60px; height: 60px; border: 3px solid #ccc; border-radius: 4px;">4</button>
    <button style="display: block; margin: 10px auto; padding: 10px; font-size: 16px; width: 60px; height: 60px; border: 3px solid #ccc; border-radius: 4px;">5</button>
    <button style="display: block; margin: 10px auto; padding: 10px; font-size: 16px; width: 60px; height: 60px; border: 3px solid #ccc; border-radius: 4px;">6</button>
    <button style="display: block; margin: 10px auto; padding: 10px; font-size: 16px; width: 60px; height: 60px; border: 3px solid #ccc; border-radius: 4px;">7</button>
    <button style="display: block; margin: 10px auto; padding: 10px; font-size: 16px; width: 60px; height: 60px; border: 3px solid #ccc; border-radius: 4px;">8</button>
    <button style="display: block; margin: 10px auto; padding: 10px; font-size: 16px; width: 60px; height: 60px; border: 3px solid #ccc; border-radius: 4px;">9</button>
    <button style="display: block; margin: 10px auto; padding: 10px; font-size: 16px; width: 60px; height: 60px; border: 3px solid #ccc; border-radius: 4px;">0</button>
    <button style="display: block; margin: 10px auto; padding: 10px; font-size: 16px; width: 65px; height: 60px; border: 3px solid #ccc; border-radius: 4px;">Delete</button>
   <button style="display: block; margin: 10px auto; padding: 10px; font-size: 16px; width:80px; height: 60px; border: 3px solid #ccc; border-radius: 4px;">Enter</button>
   
    </div>
    
</body>
</html>

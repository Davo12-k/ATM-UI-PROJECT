<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM PIN Screen</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body style="margin:0; font-family:Arial, sans-serif; background-color:#F8FAF8; color:#1F2937;">

    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh;">

           

            <h3 style="margin:0 0 10px; color:#14532D; font-size:20px;">
                Enter Your PIN
            </h3>

            <p style="font-size:14px; color:#666; margin-bottom:20px;">
                Enter your 4-digit ATM PIN
            </p>

            <input
                id="pin"
                type="password"
                maxlength="4"
                inputmode="numeric"
                placeholder="••••"
                style="padding:14px; font-size:20px; width:180px; text-align:center; border:1px solid #CCD2DC; border-radius:6px; outline-color:#14532D; box-sizing:border-box; letter-spacing:8px;"
            >

            <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; width:200px; margin:25px auto 0;">

                <button onclick="digitPin('1')" style="padding:15px; font-size:18px; font-weight:bold; background-color:#F1F4F8; border:1px solid #D8DEE8; border-radius:6px; cursor:pointer;">1</button>

                <button onclick="digitPin('2')" style="padding:15px; font-size:18px; font-weight:bold; background-color:#F1F4F8; border:1px solid #D8DEE8; border-radius:6px; cursor:pointer;">2</button>

                <button onclick="digitPin('3')" style="padding:15px; font-size:18px; font-weight:bold; background-color:#F1F4F8; border:1px solid #D8DEE8; border-radius:6px; cursor:pointer;">3</button>

                <button onclick="digitPin('4')" style="padding:15px; font-size:18px; font-weight:bold; background-color:#F1F4F8; border:1px solid #D8DEE8; border-radius:6px; cursor:pointer;">4</button>

                <button onclick="digitPin('5')" style="padding:15px; font-size:18px; font-weight:bold; background-color:#F1F4F8; border:1px solid #D8DEE8; border-radius:6px; cursor:pointer;">5</button>

                <button onclick="digitPin('6')" style="padding:15px; font-size:18px; font-weight:bold; background-color:#F1F4F8; border:1px solid #D8DEE8; border-radius:6px; cursor:pointer;">6</button>

                <button onclick="digitPin('7')" style="padding:15px; font-size:18px; font-weight:bold; background-color:#F1F4F8; border:1px solid #D8DEE8; border-radius:6px; cursor:pointer;">7</button>

                <button onclick="digitPin('8')" style="padding:15px; font-size:18px; font-weight:bold; background-color:#F1F4F8; border:1px solid #D8DEE8; border-radius:6px; cursor:pointer;">8</button>

                <button onclick="digitPin('9')" style="padding:15px; font-size:18px; font-weight:bold; background-color:#F1F4F8; border:1px solid #D8DEE8; border-radius:6px; cursor:pointer;">9</button>

                <button onclick="clearPin()" style="padding:12px 3px; font-size:12px; font-weight:bold; background-color:#B3261E; color:white; border:none; border-radius:6px; cursor:pointer;">Clear</button>

                <button onclick="digitPin('0')" style="padding:15px; font-size:18px; font-weight:bold; background-color:#F1F4F8; border:1px solid #D8DEE8; border-radius:6px; cursor:pointer;">0</button>

                <button onclick="enterPin()" style="padding:12px 3px; font-size:13px; font-weight:bold; background-color:#14532D; color:white; border:none; border-radius:6px; cursor:pointer;">Enter</button>

            </div>

            <p style="font-size:12px; color:#777; margin-top:20px;">
                Keep your PIN private.
            </p>

        </div>

    </div>

    
<script>
   
    
    
    function getUsers() {
        return JSON.parse(localStorage.getItem("atmUsers")) || [];
    }

    
    function digitPin(digit) {
        const pinInput = document.getElementById("pin");

        if (!/^\d$/.test(String(digit))) {
            return;
        }

        if (pinInput.value.length < 4) {
            pinInput.value += digit;
        }
    }

    
    function clearPin() {
        document.getElementById("pin").value = "";
    }

    
    function enterPin() {
        const enteredPin = document.getElementById("pin").value;

        
        const accountNumber = localStorage.getItem("currentAccount");

        
        const users = getUsers();

                if (!/^\d{4}$/.test(enteredPin)) {
            alert("Please enter your 4-digit PIN.");
            return;
        }

        
        const user = users.find(function(user) {
            return user.accountNumber === accountNumber;
        });

        
        if (!user) {
            alert("Account not found. Please select your card again.");
            return;
        }

        
        if (String(user.pin) === enteredPin) {
            
            localStorage.setItem("currentAccount", user.accountNumber);

            alert("Login successful!");

            window.location.href = "menu.html";
        } else {
            alert("Incorrect PIN. Please try again.");
            clearPin();
        }
    }
</script>





</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIN Screen</title>
</head>
<body>

  
<div class="pin-container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;gap: 20px;">
  <input type="password" placeholder="Enter your pin" id="pin">

  <div class="keypad" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px;">
    <button>1</button>
    <button>2</button>
    <button>3</button>
    <button>4</button>
    <button>5</button>
    <button>6</button>
    <button>7</button>
    <button>8</button>
    <button>9</button>
    <button>0</button>
    <button>Clear</button>
    <button>Enter</button>
  </div>
</div>


    
</body>
</html>

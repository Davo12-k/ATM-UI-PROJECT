<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIN Screen</title>
</head>
<body>

    <div style="background-color: white; font-family: Arial, sans-serif; text-align: center; padding: 50px; flex-direction: column; display: flex;">
        <section>
        <input type="" placeholder="Enter your pin" style="padding: 10px; margin-top: 20px; width: 200px;">


       <button>1</button>
       <button>2</button>
       <button>3</button>
       <button>4</button>
       <button>5</button>
       <button>6</button>
       <button>7</button>
       <button>8</button>
       <button>9</button>
       <button>0</button>
       <button>Delete</button>
       <button>Enter</button>

    </section>
</div>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIN Screen</title>
</head>
<body style="margin:0; font-family:Arial, sans-serif; background-color:#f1f4f8;">

    <div class="pin-container" style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; gap:20px;">

        <div style="background-color:white; padding:35px 30px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1); text-align:center; width:250px;">

            <h2 style="margin:0 0 10px; color:#172b4d; font-size:24px;">Enter Your PIN</h2>

            <p style="font-size:14px; color:#666; margin-bottom:25px;">
                Enter your 4-digit ATM PIN
            </p>

            <input id="pin" type="password" maxlength="4" placeholder="••••"
                style="padding:14px; font-size:20px; width:180px; text-align:center; border:1px solid #ccd2dc; border-radius:6px; outline:none; box-sizing:border-box; letter-spacing:8px;">

            <div class="keypad" style="display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; width:200px; margin:25px auto 0;">

                <button style="padding:15px; font-size:18px; font-weight:bold; background-color:#f1f4f8; border:1px solid #d8dee8; border-radius:6px; cursor:pointer;">1</button>

                <button style="padding:15px; font-size:18px; font-weight:bold; background-color:#f1f4f8; border:1px solid #d8dee8; border-radius:6px; cursor:pointer;">2</button>

                <button style="padding:15px; font-size:18px; font-weight:bold; background-color:#f1f4f8; border:1px solid #d8dee8; border-radius:6px; cursor:pointer;">3</button>

                <button style="padding:15px; font-size:18px; font-weight:bold; background-color:#f1f4f8; border:1px solid #d8dee8; border-radius:6px; cursor:pointer;">4</button>

                <button style="padding:15px; font-size:18px; font-weight:bold; background-color:#f1f4f8; border:1px solid #d8dee8; border-radius:6px; cursor:pointer;">5</button>

                <button style="padding:15px; font-size:18px; font-weight:bold; background-color:#f1f4f8; border:1px solid #d8dee8; border-radius:6px; cursor:pointer;">6</button>

                <button style="padding:15px; font-size:18px; font-weight:bold; background-color:#f1f4f8; border:1px solid #d8dee8; border-radius:6px; cursor:pointer;">7</button>

                <button style="padding:15px; font-size:18px; font-weight:bold; background-color:#f1f4f8; border:1px solid #d8dee8; border-radius:6px; cursor:pointer;">8</button>

                <button style="padding:15px; font-size:18px; font-weight:bold; background-color:#f1f4f8; border:1px solid #d8dee8; border-radius:6px; cursor:pointer;">9</button>

                <button style="padding:15px 5px; font-size:13px; font-weight:bold; background-color:#b3261e; color:white; border:none; border-radius:6px; cursor:pointer;">Clear</button>

                <button style="padding:15px; font-size:18px; font-weight:bold; background-color:#f1f4f8; border:1px solid #d8dee8; border-radius:6px; cursor:pointer;">0</button>

                  <a href="menu.html" style="text-decoration: none;">
                    <button style="padding:19px 25px; font: size 16px; font-weight:bold; background-color:green; color:white; border:none; border-radius:6px; cursor:pointer;">Enter</button>
                  </a>

            </div>
        </div>
    </div>

</body>
</html>

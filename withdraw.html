<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdrawal page</title>
</head>

<body style="margin: 0; font-family: Arial, sans-serif; background-color: #F8FAF8; color: #1F2937;">

    <h1 style="text-align: center; margin-top: 35px; color: #14532D; font-size: 30px;">
        Cash Withdrawal
    </h1>

    <p style="text-align: center; margin-top: 20px; color: #6B7280; font-size: 16px;">
        Enter the amount you want to withdraw
    </p>

    <input id="withdraw-amount" type="text" placeholder="Enter Amount"
        style="display: block; margin: 25px auto; padding: 14px; font-size: 18px; width: 250px; box-sizing: border-box; text-align: center; border: 2px solid #D1D5DB; border-radius: 8px; background-color: white; outline-color: #14532D;">

    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 270px; margin: 30px auto; align-items: center;">

        <button style="padding: 14px; font-size: 18px; font-weight: 600; border: 1px solid #D1D5DB; border-radius: 8px; background: white; color: black; cursor: pointer;">1</button>

        <button style="padding: 14px; font-size: 18px; font-weight: 600; border: 1px solid #D1D5DB; border-radius: 8px; background: white; color: black; cursor: pointer;">2</button>

        <button style="padding: 14px; font-size: 18px; font-weight: 600; border: 1px solid #D1D5DB; border-radius: 8px; background: white; color: black; cursor: pointer;">3</button>

        <button style="padding: 14px; font-size: 18px; font-weight: 600; border: 1px solid #D1D5DB; border-radius: 8px; background: white; color: black; cursor: pointer;">4</button>

        <button style="padding: 14px; font-size: 18px; font-weight: 600; border: 1px solid #D1D5DB; border-radius: 8px; background: white; color: black; cursor: pointer;">5</button>

        <button style="padding: 14px; font-size: 18px; font-weight: 600; border: 1px solid #D1D5DB; border-radius: 8px; background: white; color: black; cursor: pointer;">6</button>

        <button style="padding: 14px; font-size: 18px; font-weight: 600; border: 1px solid #D1D5DB; border-radius: 8px; background: white; color: black; cursor: pointer;">7</button>

        <button style="padding: 14px; font-size: 18px; font-weight: 600; border: 1px solid #D1D5DB; border-radius: 8px; background: white; color: black; cursor: pointer;">8</button>

        <button style="padding: 14px; font-size: 18px; font-weight: 600; border: 1px solid #D1D5DB; border-radius: 8px; background: white; color: black; cursor: pointer;">9</button>

        <button style="padding: 14px; font-size: 18px; font-weight: 600; border: 1px solid #D1D5DB; border-radius: 8px; background: white; color: black; cursor: pointer;">0</button>

        <button style="padding: 14px 5px; font-size: 15px; font-weight: 600; border: none; border-radius: 8px; background: #14532D; color: white; cursor: pointer;">Enter</button>

        <button style="padding: 14px 5px; font-size: 14px; font-weight: 600; border: 1px solid #F1C5C5; border-radius: 8px; background: #FFF1F1; color: #B3261E; cursor: pointer;">Delete</button>

    </div>




    <script>
        const withdrawAmountInput = document.getElementById('withdraw-amount');
        const buttons = document.querySelectorAll('button');

        buttons.forEach(button => {
            button.addEventListener('click', () => {
                const value = button.textContent;

                if (value === 'Enter') {
                    const amount = parseFloat(withdrawAmountInput.value);
                    if (!isNaN(amount) && amount > 0) {
                        alert(`You have withdrawn ₦${amount.toFixed(2)}`);
                        withdrawAmountInput.value = '';
                    } else {
                        alert('Please enter a valid amount to withdraw.');
                    }
                } else if (value === 'Delete') {
                    withdrawAmountInput.value = withdrawAmountInput.value.slice(0, -1);
                } else {
                    withdrawAmountInput.value += value;
                }
            });
        });
    

    </script>

</body>
</html>

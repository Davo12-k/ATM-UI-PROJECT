<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdrawal page</title>
</head>
<body>
    <h1 style="text-align: center; margin-top: 30px;">Withdrawal Cash</h1>

   <p style="text-align: center; margin-top: 20px; color:black;">Enter the amount you want to withdraw...</p>
   <input id="withdraw-amount" type="text" placeholder="Enter Amount" style="display: block; margin: 20px auto; padding: 10px; font-size: 16px; width: 220px; text-align: center; border: 3px solid #ccc; border-radius: 4px;">
       <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 250px; margin: 30px auto 0; align-items: center; justify-content: center;">
        <button style="padding: 12px; font-size: 18px; border: 1px solid #dbe2ea; border-radius: 6px; background: #f8fafc; cursor: pointer;">1</button>
    <button style="padding: 12px; font-size: 18px; border: 1px solid #dbe2ea; border-radius: 6px; background: #f8fafc; cursor: pointer;">2</button>
    <button style="padding: 12px; font-size: 18px; border: 1px solid #dbe2ea; border-radius: 6px; background: #f8fafc; cursor: pointer;">3</button>
    <button style="padding: 12px; font-size: 18px; border: 1px solid #dbe2ea; border-radius: 6px; background: #f8fafc; cursor: pointer;">4</button>
    <button style="padding: 12px; font-size: 18px; border: 1px solid #dbe2ea; border-radius: 6px; background: #f8fafc; cursor: pointer;">5</button>
    <button style="padding: 12px; font-size: 18px; border: 1px solid #dbe2ea; border-radius: 6px; background: #f8fafc; cursor: pointer;">6</button>
    <button style="padding: 12px; font-size: 18px; border: 1px solid #dbe2ea; border-radius: 6px; background: #f8fafc; cursor: pointer;">7</button>
    <button style="padding: 12px; font-size: 18px; border: 1px solid #dbe2ea; border-radius: 6px; background: #f8fafc; cursor: pointer;">8</button>
    <button style="padding: 12px; font-size: 18px; border: 1px solid #dbe2ea; border-radius: 6px; background: #f8fafc; cursor: pointer;">9</button>
    <button style="padding: 12px; font-size: 18px; border: 1px solid #dbe2ea; border-radius: 6px; background: #f8fafc; cursor: pointer;">0</button>
    <button style="padding: 12px; font-size: 16px; border: 1px solid #dbe2ea; border-radius: 6px; background: #f8fafc; cursor: pointer;">Enter</button>
    <button style="padding: 12px 5px; font-size: 13px; border: 1px solid #f1c5c5; border-radius: 6px; background: #fff1f1; color: #b3261e; cursor: pointer;">Delete</button>
</div>
